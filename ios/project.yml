name: BDme
options:
  bundleIdPrefix: com.lionelarbey
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: K52D9XXV9P
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.7.3"
    CURRENT_PROJECT_VERSION: "8"
targets:
  BDme:
    type: application
    platform: iOS
    sources:
      - path: BDme
    resources:
      - path: BDme/Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lionelarbey.bdme
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_FILE: BDme/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: BDme/Resources/BDme.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SUPPORTS_MACCATALYST: false
    info:
      path: BDme/Resources/Info.plist
      properties:
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSCameraUsageDescription: "BDme utilise l'appareil photo pour scanner le code-barres (EAN) de vos albums."
        ITSAppUsesNonExemptEncryption: false
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
    entitlements:
      path: BDme/Resources/BDme.entitlements
      properties:
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.lionelarbey.bdme
        com.apple.developer.icloud-services:
          - CloudDocuments
        com.apple.developer.ubiquity-container-identifiers:
          - iCloud.com.lionelarbey.bdme
schemes:
  BDme:
    build:
      targets:
        BDme: all
    run:
      config: Debug
